# Copy to <mailcow>/data/conf/nginx/auth.conf (mounted as /etc/nginx/conf.d),
# add the domain to ADDITIONAL_SAN in mailcow.conf, validate with `nginx -t`,
# then reload. Mailcow's ACME container issues the certificate; port 80
# redirects and ACME challenges stay Mailcow's. Same setup as Plano and Erudi.
server {
  # Mailcow's own listen directives, so ports and IPv6 always match its setup.
  include /etc/nginx/conf.d/listen_ssl.active;
  server_name auth.synapseengineering.dev;

  ssl_certificate /etc/ssl/mail/cert.pem;
  ssl_certificate_key /etc/ssl/mail/key.pem;

  # The largest request is a sign-up or a token exchange: a few kilobytes.
  client_max_body_size 64k;

  # Resolve at request time through Docker's DNS: a static upstream would stop
  # nginx (and webmail with it) from starting whenever the identity service is down.
  resolver 127.0.0.11 valid=30s;
  set $identity_upstream http://identity-web:80;

  location / {
    proxy_pass $identity_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
