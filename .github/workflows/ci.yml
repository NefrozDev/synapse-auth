# Verifies every change, then builds the production images on GitHub so the
# VPS (shared with Mailcow, Plano and Erudi) never runs a memory-hungry build.
# The VPS only pulls them. Images are published only from main, after all checks pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      # No dependency install scripts: every package used here ships prebuilt binaries.
      - run: npm ci --ignore-scripts
      - run: npm run lint:check
      # Both suites start PostgreSQL with Testcontainers, on the runner's Docker engine.
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular 22 needs Node ^24.15 (or ^22.22.3).
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      # Accessibility (WCAG 2.2 AA) in a real browser, against the build just made.
      # The pinned local Playwright, never one npx would fetch.
      - run: npm run e2e:install -- --with-deps
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: Frontend/dist/.playwright/results
          retention-days: 7

  images:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: synapse-auth-api
            dockerfile: Backend/Dockerfile
          - image: synapse-auth-web
            dockerfile: Frontend/Dockerfile
    steps:
      # Third-party actions are pinned to a commit: this job can push the images
      # the VPS deploys, so a moved tag must not be able to change what runs here.
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/nefrozdev/${{ matrix.image }}:latest
            ghcr.io/nefrozdev/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
