<main class="page">
  <section class="card" aria-labelledby="forgot-title">
    <h1 class="title" id="forgot-title">{{ 'forgot.title' | transloco }}</h1>

    @if (sent()) {
      <p class="alert alert--success" role="status">{{ 'forgot.sent' | transloco }}</p>
    } @else {
      <p class="subtitle">{{ 'forgot.text' | transloco }}</p>
      <form class="stack" [formRoot]="form" novalidate>
        <div class="field">
          <label class="field__label" for="forgot-email">{{ 'forgot.email' | transloco }}</label>
          <input
            id="forgot-email"
            class="field__input"
            type="email"
            autocomplete="email"
            [formField]="form.email"
            [attr.aria-invalid]="!!visibleError(form.email)"
            [attr.aria-describedby]="visibleError(form.email) ? 'forgot-email-error' : null"
          />
          @if (visibleError(form.email); as error) {
            <p class="form-error" id="forgot-email-error">{{ error | transloco }}</p>
          }
        </div>
        @if (formError(); as error) {
          <p class="alert" role="alert">{{ error | transloco }}</p>
        }
        <button class="button" type="submit" [disabled]="form().submitting()">
          {{ 'forgot.submit' | transloco }}
        </button>
      </form>
    }

    <a class="text-link" [routerLink]="backLink()">← {{ 'forgot.back' | transloco }}</a>
  </section>
</main>
